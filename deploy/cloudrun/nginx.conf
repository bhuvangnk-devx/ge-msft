# Mirrors firebase.json. Never add X-Frame-Options (Office iframes the pane) or an SPA
# catch-all (Office loads taskpane.html / commands.html / auth-redirect.html by name).
server {
  listen 8080;
  root /usr/share/nginx/html;
  server_tokens off;

  location / {
    try_files $uri $uri/ =404;
  }

  location ~ \.html$ {
    add_header Cache-Control "no-cache";
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /assets/commands.js {
    add_header Cache-Control "no-cache";
  }

  location = /functions.json {
    add_header Cache-Control "no-cache";
  }

  location /compute/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /compute/duckdb-worker.js {
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; connect-src blob:; worker-src 'none'";
  }
}
