name: Rollback

# Sends all traffic back to an earlier Cloud Run revision. Run from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: staging or production
        type: choice
        options: [staging, production]
        required: true
      revision:
        description: Revision to restore (Cloud Run console → service → Revisions)
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: |
          gcloud run services update-traffic "${{ vars.CLOUD_RUN_SERVICE }}" \
            --to-revisions="${{ inputs.revision }}=100" \
            --project "${{ vars.GCP_PROJECT }}" --region "${{ vars.GCP_REGION }}"
          echo "Traffic moved to ${{ inputs.revision }} on ${{ inputs.environment }}" >> "$GITHUB_STEP_SUMMARY"
