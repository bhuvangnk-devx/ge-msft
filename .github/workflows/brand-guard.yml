name: Brand guard

# Fails any pull request that changes the brand files, drops the brand wiring, or brings back the
# upstream name. Make it a required check on main (Settings → Branches).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Brand files, wiring and UI text
        run: scripts/brand-guard.sh
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Built pages and icons carry the brand
        run: scripts/check-brand.sh
